name: EC2 network records
on:
  push:
    branches: [ec2-runner-network-records]
  workflow_dispatch: {}

jobs:
  network:
    runs-on: depot-ubuntu-24.04,connection=ghaec2
    steps:
      - run: curl -fsS -o /dev/null -w '%{http_code}\n' https://example.com
      - run: curl -fsS -o /dev/null -w '%{http_code}\n' https://api.github.com
      - name: Check that www.google.com is blocked
        run: |
          if curl -fsS -m 15 -o /dev/null -w '%{http_code}\n' https://www.google.com; then
            echo "www.google.com is reachable"
            exit 1
          fi
          echo "www.google.com is blocked"
